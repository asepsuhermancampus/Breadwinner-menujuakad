name: V2 Quality
on: [push, pull_request]
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: Menuju_Akad_V2/.nvmrc
          cache: npm
          cache-dependency-path: Menuju_Akad_V2/package-lock.json
      - run: npm ci
        working-directory: Menuju_Akad_V2
      - run: npm run db:generate && npm run check
        working-directory: Menuju_Akad_V2
      - run: npx playwright install --with-deps chromium
        working-directory: Menuju_Akad_V2
      - run: npm run test:e2e
        working-directory: Menuju_Akad_V2
